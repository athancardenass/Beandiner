<!doctype html>
<!-- ↓ HTML ROOT: Document root with English language attribute -->
<html lang="en">
  <!-- ↓ HEAD: Document metadata and resource loading -->
  <head>
    <!-- ↓ CHARSET: UTF-8 character encoding -->
    <meta charset="UTF-8" />
    <!-- ↓ VIEWPORT: Responsive viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ↓ THEME COLOR: Browser chrome color (warm diner brown) -->
    <meta name="theme-color" content="#343b32" />
    <!-- ↓ DESCRIPTION: Meta description for SEO -->
    <meta
      name="description"
      content="Bean Diner in Bayambang, Pangasinan. Founded by a US-trained Chef & Middle East-skilled Barista. Comfort food, Oatside creations, Benguet highland coffee, and warm community vibes."
    />
    <!-- ↓ OG TITLE: Open Graph title for social sharing -->
    <meta
      property="og:title"
      content="Bean Diner | Good Food. Great Coffee. Warm Vibes."
    />
    <!-- ↓ OG DESCRIPTION: Open Graph description -->
    <meta
      property="og:description"
      content="Where the food heals and the coffee understands you. Visit us on Gen. Antonio Luna St., Zone 2, Bayambang, Pangasinan."
    />
    <!-- ↓ OG TYPE: Open Graph content type (website) -->
    <meta property="og:type" content="website" />
    <!-- ↓ OG IMAGE: Open Graph share image -->
    <meta property="og:image" content="./images/menu/caffe-latte.webp" />
    <!-- ↓ FAVICON: Browser tab icon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- ↓ PRECONNECT: Early connection to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ↓ PRELOAD: Preload hero image for performance -->
    <link rel="preload" as="image" href="./images/optimized/latte.webp" />
    <!-- ↓ TITLE: Browser tab title -->
    <title>Bean Diner | Good Food. Great Coffee. Warm Vibes.</title>
    <!-- ↓ END HEAD -->
