<!doctype html>
<!-- ↓ HTML ROOT: Document root with English language attribute -->
<html lang="en">
  <!-- ↓ HEAD: Document metadata and resource loading -->
  <head>
    <!-- ↓ CHARSET: UTF-8 character encoding -->
    <meta charset="UTF-8" />
    <!-- ↓ VIEWPORT: Responsive viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Initial header color; mobile chrome follows the visible section. -->
    <meta name="theme-color" content="#121212" />
    <!-- ↓ DESCRIPTION: Meta description for SEO -->
    <meta
      name="description"
      content="Bean Diner in Bayambang, Pangasinan. Founded by a US-trained Chef & Middle East-skilled Barista. Comfort food, Oatside creations, Benguet highland coffee, and warm community vibes."
    />
    <!-- ↓ OG TITLE: Open Graph title for social sharing -->
    <meta
      property="og:title"
      content="Bean Diner | Good Food. Great Coffee. Warm Vibes."
    />
    <!-- ↓ OG DESCRIPTION: Open Graph description -->
    <meta
      property="og:description"
      content="Where the food heals and the coffee understands you. Visit us on Gen. Antonio Luna St., Zone 2, Bayambang, Pangasinan."
    />
    <!-- ↓ OG TYPE: Open Graph content type (website) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bean Diner" />
    <meta property="og:locale" content="en_PH" />
    <!-- ↓ OG URL + IMAGE: Absolute URLs (replaced with VITE_SITE_URL at build time) -->
    <link rel="canonical" href="./" />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="./images/menu/diner-showcase.webp" />
    <meta property="og:image:width" content="1448" />
    <meta property="og:image:height" content="1086" />
    <meta property="og:image:alt" content="Bean Diner coffee and comfort food" />
    <!-- ↓ TWITTER CARD: Large image preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bean Diner | Good Food. Great Coffee. Warm Vibes."
    />
    <meta
      name="twitter:description"
      content="Where the food heals and the coffee understands you. Bayambang, Pangasinan."
    />
    <meta name="twitter:image" content="./images/menu/diner-showcase.webp" />
    <!-- ↓ FAVICON: Browser tab icon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="icon" type="image/png" href="./images/bean_diner_logo_white.png" />
    <link rel="apple-touch-icon" href="./favicon-badge.png" />
    <!-- ↓ PRECONNECT: Early connection to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ↓ PRELOAD: Load the first visible video poster early -->
    <link rel="preload" as="image" href="./images/bean-diner-video-poster.webp" fetchpriority="high" />
    <!-- ↓ TITLE: Browser tab title -->
    <title>Bean Diner | Good Food. Great Coffee. Warm Vibes.</title>
    <!-- ↓ STRUCTURED DATA: Local business info for Google (hours match the store-status badge) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Restaurant", "CafeOrCoffeeShop"],
        "name": "Bean Diner",
        "description": "Comfort food, specialty coffee, and warm community vibes in Bayambang, Pangasinan.",
        "url": "./",
        "image": "./images/menu/diner-showcase.webp",
        "telephone": "+639153995000",
        "servesCuisine": ["Comfort food", "Coffee", "Filipino"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Gen. Antonio Luna St., Zone 2",
          "addressLocality": "Bayambang",
          "addressRegion": "Pangasinan",
          "addressCountry": "PH"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 15.8103457,
          "longitude": 120.4573329
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "10:00",
          "closes": "21:00"
        },
        "sameAs": ["https://www.facebook.com/beandiner"]
      }
    </script>
    <!-- ↓ END HEAD -->
