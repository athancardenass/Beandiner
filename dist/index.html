<!doctype html>
<!-- ↓ HTML ROOT: Document root with English language attribute -->
<html lang="en">
  <!-- ↓ HEAD: Document metadata and resource loading -->
  <head>
    <!-- ↓ CHARSET: UTF-8 character encoding -->
    <meta charset="UTF-8" />
    <!-- ↓ VIEWPORT: Responsive viewport meta tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ↓ THEME COLOR: Browser chrome color (mint) -->
    <meta name="theme-color" content="#d3e8df" />
    <!-- ↓ DESCRIPTION: Meta description for SEO -->
    <meta
      name="description"
      content="Meet Saya Coffee. Modern Filipino-inspired coffee, playful flavors, and a little cup of happy. Explore six signature drinks and find your everyday favorite."
    />
    <!-- ↓ OG TITLE: Open Graph title for social sharing -->
    <meta property="og:title" content="Saya Coffee | A Little Cup of Happy" />
    <!-- ↓ OG DESCRIPTION: Open Graph description -->
    <meta
      property="og:description"
      content="Good days. Great coffee. Discover your daily dose of saya."
    />
    <!-- ↓ OG TYPE: Open Graph content type (website) -->
    <meta property="og:type" content="website" />
    <!-- ↓ OG IMAGE: Open Graph share image (merienda.webp) -->
    <meta property="og:image" content="./images/optimized/merienda.webp" />
    <!-- ↓ FAVICON: Browser tab icon (SVG) -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- ↓ PRECONNECT: Early connection to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ↓ PRELOAD: Preload hero image for performance -->
    <link rel="preload" as="image" href="./images/optimized/latte.webp" />
    <!-- ↓ TITLE: Browser tab title -->
    <title>Saya Coffee | A Little Cup of Happy</title>
    <!-- ↓ END HEAD -->
